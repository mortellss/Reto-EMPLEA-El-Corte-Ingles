<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMPLEA | Calendario del trabajador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/sidebar.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/calendario_trabajador.css') }}"
    >
</head>

<body>

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="logo">
            <img
                src="{{ url_for('static', filename='img/logo.webp') }}"
                alt="Logo"
            >
        </div>

        <nav>

            <a href="{{ url_for('dashboard') }}">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('gestion_datos') }}">
                <i class="fa-solid fa-users"></i>
                <span>Gestión de datos</span>
            </a>

            <a href="{{ url_for('historicos') }}">
                <i class="fa-solid fa-database"></i>
                <span>Datos históricos</span>
            </a>

            <a href="{{ url_for('prediccion') }}">
                <i class="fa-solid fa-chart-line"></i>
                <span>Predicción</span>
            </a>

            <a href="{{ url_for('planificacion') }}">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Planificación</span>
            </a>

            <a href="{{ url_for('configuracion') }}">
                <i class="fa-solid fa-gear"></i>
                <span>Configuración</span>
            </a>

        </nav>

    </aside>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h2>
                    Calendario del trabajador
                </h2>

                <p>
                    Consulta la planificación individual del trabajador.
                </p>

            </div>

        </header>


        <section class="content">

            <!-- Volver -->

            <a
                href="{{ url_for('calendarios_trabajadores') }}"
                class="volver-calendarios"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Volver a trabajadores
            </a>

            <!-- =================================================
                 INFORMACIÓN DEL TRABAJADOR
                 ================================================= -->

            <div class="trabajador-header">

                <div>

                    <h1 id="nombreTrabajador">
                        Cargando...
                    </h1>

                    <p id="informacionTrabajador">
                        —
                    </p>

                </div>

            </div>


            <!-- =================================================
                 LEYENDA
                 ================================================= -->

            <div class="calendario-leyenda">

                <div>
                    <span class="leyenda-color manana"></span>
                    Mañana
                </div>

                <div>
                    <span class="leyenda-color tarde"></span>
                    Tarde
                </div>

                <div>
                    <span class="leyenda-color libre"></span>
                    Libre
                </div>

                <div>
                    <span class="leyenda-color vacaciones"></span>
                    Vacaciones
                </div>

            </div>


            <!-- =================================================
                 NAVEGACIÓN DEL MES
                 ================================================= -->

            <div class="calendario-navegacion">

                <button
                    id="mesAnterior"
                    type="button"
                    aria-label="Mes anterior"
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>


                <h2 id="mesActual"></h2>


                <button
                    id="mesSiguiente"
                    type="button"
                    aria-label="Mes siguiente"
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

            </div>


            <!-- =================================================
                 CALENDARIO
                 ================================================= -->

            <div class="calendario">

                <div class="calendario-dias-semana">

                    <div>L</div>
                    <div>M</div>
                    <div>X</div>
                    <div>J</div>
                    <div>V</div>
                    <div>S</div>
                    <div>D</div>

                </div>


                <div
                    id="diasCalendario"
                    class="calendario-grid"
                >
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         MODAL — DETALLE DEL DÍA
         ===================================================== -->

    <div
        id="modalDia"
        class="modal-dia"
    >

        <div class="modal-dia-contenido">

            <button
                id="cerrarModal"
                class="cerrar-modal"
                type="button"
                aria-label="Cerrar"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>


            <div class="modal-dia-cabecera">

                <span class="modal-dia-icono">
                    <i class="fa-solid fa-calendar-day"></i>
                </span>

                <div>

                    <h2 id="modalFecha">
                        —
                    </h2>

                    <p>
                        Detalle de la jornada
                    </p>

                </div>

            </div>


            <div
                id="modalDetalles"
                class="modal-detalles"
            >
            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="{{ url_for('static', filename='js/calendario_trabajador.js') }}"
    ></script>

</body>
</html>
