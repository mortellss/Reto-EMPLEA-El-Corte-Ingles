<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLEA | Calendarios por trabajador</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo2.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendarios_trabajadores.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tema.css') }}">
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo">
        </div>

        <nav>

            <a href="{{ url_for('dashboard') }}">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('gestion_datos') }}">
                <i class="fa-solid fa-users"></i>
                <span>Gestión de datos</span>
            </a>

            <a href="{{ url_for('historicos') }}">
                <i class="fa-solid fa-database"></i>
                <span>Datos históricos</span>
            </a>

            <a href="{{ url_for('prediccion') }}">
                <i class="fa-solid fa-chart-line"></i>
                <span>Predicción</span>
            </a>

            <a href="{{ url_for('planificacion') }}" class="active">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Planificación</span>
            </a>

            <a href="{{ url_for('configuracion') }}">
                <i class="fa-solid fa-gear"></i>
                <span>Configuración</span>
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h2>Calendarios por trabajador</h2>
                <p>
                    Consulta la planificación individual de cada trabajador.
                </p>
            </div>

            <div class="user">
                <div class="user-info"><span>Usuario</span></div>
                <button type="button" class="tema-boton" aria-label="Activar modo oscuro"></button>
            </div>

        </header>

        <section class="content">

            <a href="{{ url_for('planificacion') }}" class="volver-planificacion">
                <i class="fa-solid fa-arrow-left"></i>
                Volver a planificación
            </a>

            <div class="calendarios-header">

                <div>
                    <h1>Selecciona un trabajador</h1>
                    <p>
                        Consulta su calendario mensual, turnos, días libres y vacaciones.
                    </p>
                </div>

                <div class="buscador-trabajadores">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="buscarTrabajador"
                        placeholder="Buscar trabajador..."
                    >
                </div>

            </div>

            <div id="listaTrabajadores" class="lista-trabajadores">
            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/calendarios_trabajadores.js') }}"></script>

</body>
</html>
